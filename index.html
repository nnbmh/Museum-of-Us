<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Museum of Us</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #e1c092;
  --cream: #f6ead8;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #090807;
}

body {
  font-family: "DM Sans", sans-serif;
  color: var(--cream);
}

button {
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1s ease, visibility 1s;
}

.scene.active {
  opacity: 1;
  visibility: visible;
}

/* MUSEUM ENTRANCE */

#entrance {
  background: #080909;
}

.entrance-art {
  position: absolute;
  inset: -3%;
  background: url("museum-entrance.PNG") center / cover no-repeat;
  animation: slowCamera 35s ease-out forwards;
}

@keyframes slowCamera {
  from { transform: scale(1.04); }
  to { transform: scale(1.10); }
}

.entrance-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.38),
    transparent 30%,
    transparent 55%,
    rgba(0,0,0,.78)
  );
}

.entrance-content {
  position: absolute;
  bottom: clamp(30px, 6vh, 65px);
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 560px);
  text-align: center;
  z-index: 5;
}

.subtitle {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(17px, 2vw, 23px);
  font-style: italic;
  letter-spacing: .035em;
  color: #e0d0bb;
  margin: 0 0 22px;
  text-shadow: 0 2px 15px #000;
}

.enter-button,
.explore-button {
  padding: 14px 32px;
  background: rgba(15,11,9,.65);
  border: 1px solid rgba(225,192,146,.7);
  color: var(--cream);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: .2em;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: background .3s ease, transform .3s ease;
}

.enter-button:hover,
.explore-button:hover {
  background: rgba(100,65,35,.8);
  transform: translateY(-3px);
}

.enter-button:disabled {
  opacity: .5;
}

.camera-overlay {
  position: absolute;
  inset: 0;
  background: #090807;
  opacity: 0;
  pointer-events: none;
  z-index: 8;
  transition: opacity 1.3s ease;
}

#entrance.entering .entrance-art {
  animation: enterCamera 2.5s ease-in forwards;
}

#entrance.entering .entrance-content {
  opacity: 0;
  transition: opacity .6s;
}

#entrance.entering .camera-overlay {
  opacity: 1;
  transition-delay: 1.5s;
}

@keyframes enterCamera {
  from { transform: scale(1.08); }
  to { transform: scale(1.7); }
}

/* MUSEUM LOBBY */

#lobby {
  background: #100c09;
}

.lobby-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  animation: lobbyReveal 3s ease-out both;
}

@keyframes lobbyReveal {
  from {
    transform: scale(1.08);
    filter: brightness(.45);
  }

  to {
    transform: scale(1);
    filter: brightness(1);
  }
}

.lobby-shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.18),
    transparent 35%,
    rgba(0,0,0,.25)
  );
}

/* WELCOME MESSAGE */

.lobby-caption {
  position: absolute;
  top: 15%;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 620px);
  padding: 24px 35px;
  text-align: center;
  z-index: 3;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    rgba(15,10,7,.72),
    rgba(15,10,7,.38) 45%,
    transparent 75%
  );
  text-shadow: 0 3px 15px #000, 0 1px 4px #000;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: #f2d7ad;
}

.lobby-caption h2 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(30px, 4vw, 46px);
  font-weight: 500;
  margin: 12px 0;
  letter-spacing: .045em;
  color: #fff0da;
}

.lobby-caption p {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(17px, 2vw, 22px);
  font-style: italic;
  color: #f0dcc1;
  margin: 0;
}

/* BEGIN EXPLORING BUTTON */

.explore-container {
  position: absolute;
  bottom: clamp(24px, 5vh, 60px);
  right: clamp(20px, 4vw, 65px);
  left: auto;
  transform: none;
  z-index: 5;
  text-align: right;
}

.explore-button {
  white-space: nowrap;
  box-shadow: 0 8px 35px rgba(0,0,0,.4);
  animation: exploreAppear 1.5s ease 1.5s both;
}

@keyframes exploreAppear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* SMALL SCREENS */

@media (max-width: 600px) {
  .lobby-caption {
    top: 12%;
    padding: 20px;
  }

  .explore-container {
    bottom: 4vh;
  }
}

@media (prefers-reduced-motion: reduce) {
  .entrance-art,
  .lobby-art,
  .explore-button {
    animation: none;
  }
}
</style>
</head>

<body>

<!-- ENTRANCE -->

<section id="entrance" class="scene active">

  <div class="entrance-art"></div>
  <div class="entrance-shade"></div>

  <div class="entrance-content">
    <p class="subtitle">
      An exhibition of a love story still being made.
    </p>

    <button
      class="enter-button"
      id="enterButton"
      onclick="enterMuseum()">
      ENTER THE MUSEUM →
    </button>
  </div>

  <div class="camera-overlay"></div>

</section>

<!-- LOBBY -->

<section id="lobby" class="scene">

  <img
    class="lobby-art"
    src="museum-lobby.PNG"
    alt="Grand museum lobby with an admission ticket on the reception desk">

  <div class="lobby-shade"></div>

  <div class="lobby-caption">
    <div class="eyebrow">Welcome, Faris</div>

    <h2>A Collection of Us</h2>

    <p>Some things are too special to leave forgotten.</p>
  </div>

  <div class="explore-container">
    <button
      class="explore-button"
      onclick="beginExploring()">
      BEGIN EXPLORING →
    </button>
  </div>

</section>

<script>
function enterMuseum() {
  const entrance = document.getElementById("entrance");
  const button = document.getElementById("enterButton");

  if (entrance.classList.contains("entering")) return;

  button.disabled = true;
  entrance.classList.add("entering");

  setTimeout(() => {
    document.getElementById("lobby").classList.add("active");
    entrance.classList.remove("active");
  }, 2700);
}

function beginExploring() {
  // Gallery I will be connected here.
}
</script>

</body>
</html>
