<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Museum of Us</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #e1c092;
  --cream: #f6ead8;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #090807;
}

body {
  font-family: "DM Sans", sans-serif;
  color: var(--cream);
}

button {
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1s ease, visibility 1s;
}

.scene.active {
  opacity: 1;
  visibility: visible;
}

/* ENTRANCE */

#entrance {
  background: #080909;
}

.entrance-art {
  position: absolute;
  inset: -3%;
  background: url("museum-entrance.PNG") center / cover no-repeat;
  animation: slowCamera 35s ease-out forwards;
}

@keyframes slowCamera {
  from { transform: scale(1.04); }
  to { transform: scale(1.10); }
}

.entrance-shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.38),
    transparent 30%,
    transparent 55%,
    rgba(0,0,0,.78)
  );
}

.entrance-content {
  position: absolute;
  bottom: clamp(30px, 6vh, 65px);
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 560px);
  text-align: center;
  z-index: 5;
}

.subtitle {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(17px, 2vw, 23px);
  font-style: italic;
  letter-spacing: .035em;
  color: #e0d0bb;
  margin: 0 0 22px;
  text-shadow: 0 2px 15px #000;
}

.enter-button {
  padding: 13px 30px;
  background: rgba(15,11,9,.55);
  border: 1px solid rgba(225,192,146,.65);
  color: var(--cream);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: .2em;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.camera-overlay {
  position: absolute;
  inset: 0;
  background: #090807;
  opacity: 0;
  pointer-events: none;
  z-index: 8;
  transition: opacity 1.3s ease;
}

#entrance.entering .entrance-art {
  animation: enterCamera 2.5s ease-in forwards;
}

#entrance.entering .entrance-content {
  opacity: 0;
  transition: opacity .6s;
}

#entrance.entering .camera-overlay {
  opacity: 1;
  transition-delay: 1.5s;
}

@keyframes enterCamera {
  from { transform: scale(1.08); }
  to { transform: scale(1.7); }
}

/* LOBBY */

#lobby {
  background: #100c09;
}

.lobby-art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  animation: lobbyReveal 3s ease-out both;
  transition:
    transform 1.8s cubic-bezier(.2,.7,.2,1),
    filter 1.8s ease;
}

@keyframes lobbyReveal {
  from {
    transform: scale(1.08);
    filter: brightness(.45);
  }
  to {
    transform: scale(1);
    filter: brightness(1);
  }
}

.lobby-shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,.18),
    transparent 35%,
    rgba(0,0,0,.25)
  );
}

/* LOBBY TITLE */

.lobby-caption {
  position: absolute;
  top: 15%;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 620px);
  text-align: center;
  z-index: 3;
  padding: 24px 35px;
  pointer-events: none;
  background: radial-gradient(
    ellipse at center,
    rgba(15,10,7,.72) 0%,
    rgba(15,10,7,.38) 45%,
    transparent 75%
  );
  text-shadow: 0 3px 15px #000, 0 1px 4px #000;
  transition: opacity .5s ease;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: #f2d7ad;
}

.lobby-caption h2 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(30px, 4vw, 46px);
  font-weight: 500;
  margin: 12px 0;
  letter-spacing: .045em;
  color: #fff0da;
}

.lobby-caption p {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(17px, 2vw, 22px);
  font-style: italic;
  color: #f0dcc1;
  margin: 0;
}

/* INVISIBLE TICKET HOTSPOT */

.ticket-hotspot {
  position: absolute;
  z-index: 4;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  touch-action: manipulation;
}

.ticket-hotspot:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 4px;
}

.ticket-hint {
  position: absolute;
  z-index: 4;
  bottom: 3%;
  left: 50%;
  transform: translateX(-50%);
  color: #f1d8b1;
  font-size: 10px;
  letter-spacing: .18em;
  text-shadow: 0 2px 12px #000;
  white-space: nowrap;
  pointer-events: none;
  transition: opacity .4s ease;
}

/* CAMERA ZOOM TOWARDS TICKET */

#lobby.zooming .lobby-art {
  animation: none;
  transform: scale(1.65);
  transform-origin: 56% 77%;
  filter: blur(5px) brightness(.55);
}

#lobby.zooming .lobby-caption,
#lobby.zooming .ticket-hint {
  opacity: 0;
}

#lobby.zooming .ticket-hotspot {
  pointer-events: none;
}

/* PHOTOGRAPHIC TICKET CLOSE-UP */

.ticket-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  overflow: hidden;
  background: #100b08;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1.1s ease, visibility 1.1s;
}

.ticket-overlay.open {
  opacity: 1;
  visibility: visible;
}

/* Blurred image fills the screen behind the ticket */

.ticket-backdrop {
  position: absolute;
  inset: -5%;
  background: url("museum-ticket.PNG") center / cover no-repeat;
  filter: blur(24px) brightness(.45);
  transform: scale(1.1);
}

/* Full ticket image stays visible */

.ticket-photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  transform: scale(1.08);
  opacity: .5;
  transition: transform 1.2s ease, opacity 1s ease;
}

.ticket-overlay.open .ticket-photo {
  transform: scale(1);
  opacity: 1;
}

.ticket-close {
  position: absolute;
  top: max(22px, env(safe-area-inset-top));
  right: 25px;
  z-index: 3;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(255,235,205,.55);
  border-radius: 50%;
  background: rgba(15,10,7,.65);
  color: #fff1df;
  font-size: 25px;
  line-height: 1;
}

.visit-button {
  position: absolute;
  z-index: 3;
  bottom: max(25px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 28px;
  border: 1px solid rgba(225,192,146,.8);
  background: rgba(20,13,9,.88);
  color: #f6ead8;
  font-size: 10px;
  letter-spacing: .18em;
  white-space: nowrap;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.ticket-close,
.visit-button {
  opacity: 0;
  transition: opacity .5s ease .7s;
}

.ticket-overlay.open .ticket-close,
.ticket-overlay.open .visit-button {
  opacity: 1;
}

@media (max-width: 600px) {
  .lobby-caption {
    top: 12%;
    padding: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .entrance-art,
  .lobby-art {
    animation: none;
  }
}
</style>
</head>

<body>

<!-- ENTRANCE -->

<section id="entrance" class="scene active">

  <div class="entrance-art"></div>
  <div class="entrance-shade"></div>

  <div class="entrance-content">
    <p class="subtitle">
      An exhibition of a love story still being made.
    </p>

    <button
      class="enter-button"
      id="enterButton"
      onclick="enterMuseum()">
      ENTER THE MUSEUM →
    </button>
  </div>

  <div class="camera-overlay"></div>

</section>

<!-- LOBBY -->

<section id="lobby" class="scene">

  <img
    class="lobby-art"
    id="lobbyArt"
    src="museum-lobby.PNG"
    alt="Grand museum lobby with an admission ticket on the reception desk"
  >

  <div class="lobby-shade"></div>

  <div class="lobby-caption">
    <div class="eyebrow">Welcome, Faris</div>
    <h2>A Collection of Us</h2>
    <p>Some things are too special to leave forgotten.</p>
  </div>

  <button
    class="ticket-hotspot"
    id="ticketHotspot"
    onclick="openTicket()"
    aria-label="Examine your admission ticket">
  </button>

  <div class="ticket-hint">
    ✦ TAP THE TICKET ✦
  </div>

  <!-- TICKET CLOSE-UP -->

  <div
    class="ticket-overlay"
    id="ticketOverlay"
    role="dialog"
    aria-modal="true"
    aria-label="Museum admission ticket"
    aria-hidden="true">

    <div class="ticket-backdrop"></div>

    <img
      class="ticket-photo"
      src="museum-ticket.PNG"
      alt="The Museum of Us admission ticket for Faris, dated 02.12.2026"
    >

    <button
      class="ticket-close"
      onclick="closeTicket()"
      aria-label="Close ticket">
      ×
    </button>

    <button
      class="visit-button"
      onclick="beginVisit()">
      BEGIN YOUR VISIT →
    </button>

  </div>

</section>

<script>
const entrance = document.getElementById("entrance");
const lobby = document.getElementById("lobby");
const overlay = document.getElementById("ticketOverlay");
const lobbyArt = document.getElementById("lobbyArt");
const hotspot = document.getElementById("ticketHotspot");

let transitioning = false;

function enterMuseum() {
  const button = document.getElementById("enterButton");

  if (entrance.classList.contains("entering")) return;

  button.disabled = true;
  entrance.classList.add("entering");

  setTimeout(() => {
    lobby.classList.add("active");
    entrance.classList.remove("active");
    positionTicketHotspot();
  }, 2700);
}

/* KEEP HOTSPOT ALIGNED WITH TICKET */

function positionTicketHotspot() {
  const imageWidth = lobbyArt.naturalWidth;
  const imageHeight = lobbyArt.naturalHeight;

  if (!imageWidth || !imageHeight) return;

  const viewWidth = lobbyArt.clientWidth;
  const viewHeight = lobbyArt.clientHeight;

  const scale = Math.max(
    viewWidth / imageWidth,
    viewHeight / imageHeight
  );

  const displayedWidth = imageWidth * scale;
  const displayedHeight = imageHeight * scale;

  const offsetX = (viewWidth - displayedWidth) / 2;
  const offsetY = (viewHeight - displayedHeight) / 2;

  const x = 0.36;
  const y = 0.62;
  const w = 0.38;
  const h = 0.24;

  hotspot.style.left =
    (offsetX + x * displayedWidth) + "px";

  hotspot.style.top =
    (offsetY + y * displayedHeight) + "px";

  hotspot.style.width =
    (w * displayedWidth) + "px";

  hotspot.style.height =
    (h * displayedHeight) + "px";
}

/* ZOOM TOWARDS THE TICKET */

function openTicket() {
  if (transitioning) return;
  transitioning = true;

  lobby.classList.add("zooming");

  setTimeout(() => {
    overlay.classList.add("open");
    overlay.setAttribute("aria-hidden", "false");
  }, 850);
}

function closeTicket() {
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");

  setTimeout(() => {
    lobby.classList.remove("zooming");
    transitioning = false;
  }, 1100);
}

function beginVisit() {
  closeTicket();

  // Gallery I will be connected here.
}

lobbyArt.addEventListener("load", positionTicketHotspot);
window.addEventListener("resize", positionTicketHotspot);

if (lobbyArt.complete) {
  positionTicketHotspot();
}
</script>

</body>
</html>
