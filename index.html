<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Museum of Us</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #e1c092;
  --cream: #f6ead8;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #090807;
}

body {
  font-family: "DM Sans", sans-serif;
  color: var(--cream);
}

button {
  font: inherit;
  cursor: pointer;
}

.scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1.1s ease, visibility 1.1s;
}

.scene.active {
  opacity: 1;
  visibility: visible;
}

/* CINEMATIC ENTRANCE */

#entrance {
  background: #080909;
}

.entrance-art {
  position: absolute;
  inset: -3%;
  background-image: url("museum-entrance.png");
  background-size: cover;
  background-position: center;
  transform: scale(1.04);
  animation: slowCamera 18s ease-in-out infinite alternate;
}

@keyframes slowCamera {
  from { transform: scale(1.04); }
  to { transform: scale(1.12); }
}

.entrance-shade {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.38),
      transparent 30%,
      transparent 55%,
      rgba(0,0,0,.78)
    );
}

.entrance-content {
  position: absolute;
  bottom: clamp(45px, 9vh, 100px);
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 560px);
  text-align: center;
  z-index: 5;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--gold);
}

.entrance-content h1 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(45px, 8vw, 90px);
  font-weight: 500;
  letter-spacing: .045em;
  line-height: .95;
  margin: 15px 0;
  text-shadow: 0 4px 25px #000;
}

.subtitle {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(19px, 3vw, 26px);
  font-style: italic;
  color: #e0d0bb;
  margin: 0 0 30px;
}

.enter-button {
  background: rgba(19, 13, 9, .72);
  color: var(--cream);
  border: 1px solid rgba(225, 192, 146, .8);
  padding: 15px 35px;
  font-size: 11px;
  letter-spacing: .22em;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: background .3s, transform .3s;
}

.enter-button:hover {
  background: rgba(110, 72, 37, .8);
  transform: translateY(-3px);
}

.enter-button:disabled {
  opacity: .5;
}

.camera-overlay {
  position: absolute;
  inset: 0;
  background: #090807;
  opacity: 0;
  pointer-events: none;
  z-index: 8;
  transition: opacity 1.3s ease;
}

#entrance.entering .entrance-art {
  animation: enterCamera 2.5s ease-in forwards;
}

#entrance.entering .entrance-content {
  opacity: 0;
  transition: opacity .6s;
}

#entrance.entering .camera-overlay {
  opacity: 1;
  transition-delay: 1.5s;
}

@keyframes enterCamera {
  from { transform: scale(1.08); }
  to { transform: scale(1.7); }
}

/* TEMPORARY LOBBY */

#lobby {
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at center, #6b462a 0%, #1a120e 55%, #090807 100%);
}

.lobby-content {
  text-align: center;
  padding: 30px;
  max-width: 550px;
}

.lobby-content h2 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(48px, 9vw, 85px);
  font-weight: 500;
  margin: 15px 0;
}

.lobby-content p {
  font-family: "Cormorant Garamond", serif;
  font-size: 25px;
  font-style: italic;
  color: #d8bea0;
}

.ticket {
  margin: 35px auto 0;
  width: min(85vw, 340px);
  background: #e4cfab;
  color: #32241a;
  padding: 30px 20px;
  border: 2px solid #a98658;
  box-shadow: 0 20px 70px #0009;
  transform: rotate(-3deg);
}

.ticket h3 {
  font-family: "Cormorant Garamond", serif;
  font-size: 32px;
  margin: 10px 0;
}

.ticket p {
  font-family: "DM Sans", sans-serif;
  font-size: 11px;
  line-height: 2.1;
  font-style: normal;
  color: #473528;
}

.ticket button {
  margin-top: 15px;
  border: 1px solid #886744;
  background: transparent;
  color: #473528;
  padding: 12px 18px;
  font-size: 10px;
  letter-spacing: .12em;
}

/* SMALL SCREENS */

@media (max-width: 600px) {
  .entrance-art {
    background-position: center;
  }

  .entrance-content {
    bottom: 8vh;
  }
}

@media (prefers-reduced-motion: reduce) {
  .entrance-art {
    animation: none;
  }
}
</style>
</head>

<body>

<section id="entrance" class="scene active">

  <div class="entrance-art"></div>
  <div class="entrance-shade"></div>

  <div class="entrance-content">
    <div class="eyebrow">Established 2024 · Still collecting memories</div>

    <h1>The Museum<br>of Us</h1>

    <p class="subtitle">
      An exhibition of a love story still being made.
    </p>

    <button class="enter-button" id="enterButton" onclick="enterMuseum()">
      ENTER THE MUSEUM
    </button>
  </div>

  <div class="camera-overlay"></div>

</section>

<section id="lobby" class="scene">

  <div class="lobby-content">
    <div class="eyebrow">Welcome, Faris</div>

    <h2>A Collection of Us</h2>

    <p>Some things are too special to leave forgotten.</p>

    <div class="ticket">
      <div class="eyebrow" style="color:#76583a">
        ADMISSION TICKET
      </div>

      <h3>The Museum of Us</h3>

      <p>
        VISITOR: FARIS<br>
        DATE: 02.12.2026<br>
        ADMISSION: ONE VERY SPECIAL GUEST
      </p>

      <button onclick="alert('The first gallery is coming next!')">
        BEGIN YOUR VISIT →
      </button>
    </div>
  </div>

</section>

<script>
function enterMuseum() {
  const entrance = document.getElementById("entrance");
  const button = document.getElementById("enterButton");

  if (entrance.classList.contains("entering")) return;

  button.disabled = true;
  entrance.classList.add("entering");

  setTimeout(() => {
    document.getElementById("lobby").classList.add("active");
    entrance.classList.remove("active");
  }, 2700);
}
</script>

</body>
</html>
