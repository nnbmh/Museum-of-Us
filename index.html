<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Museum of Us</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #e1c092;
  --cream: #f6ead8;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #090807;
}

body {
  font-family: "DM Sans", sans-serif;
  color: var(--cream);
}

button {
  font: inherit;
  cursor: pointer;
}

.scene {
  position: fixed;
  inset: 0;
  overflow: hidden;
  opacity: 0;
  visibility: hidden;
  transition: opacity 1.1s ease, visibility 1.1s;
}

.scene.active {
  opacity: 1;
  visibility: visible;
}

/* CINEMATIC ENTRANCE */

#entrance {
  background: #080909;
}

.entrance-art {
  position: absolute;
  inset: -3%;
  background-image: url("museum-entrance.PNG");
  background-size: cover;
  background-position: center;
  transform: scale(1.04);
  animation: slowCamera 35s ease-out forwards;
}

@keyframes slowCamera {
  from { transform: scale(1.04); }
  to { transform: scale(1.10); }
}

.entrance-shade {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.38),
      transparent 30%,
      transparent 55%,
      rgba(0,0,0,.78)
    );
}

.entrance-content {
  position: absolute;
  bottom: clamp(45px, 9vh, 100px);
  left: 50%;
  transform: translateX(-50%);
  width: min(90%, 560px);
  text-align: center;
  z-index: 5;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--gold);
}

.entrance-content h1 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(45px, 8vw, 90px);
  font-weight: 500;
  letter-spacing: .045em;
  line-height: .95;
  margin: 15px 0;
  text-shadow: 0 4px 25px #000;
}

.subtitle {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(19px, 3vw, 26px);
  font-style: italic;
  color: #e0d0bb;
  margin: 0 0 30px;
}

.enter-button {
  background: rgba(19, 13, 9, .72);
  color: var(--cream);
  border: 1px solid rgba(225, 192, 146, .8);
  padding: 15px 35px;
  font-size: 11px;
  letter-spacing: .22em;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: background .3s, transform .3s;
}

.enter-button:hover {
  background: rgba(110, 72, 37, .8);
  transform: translateY(-3px);
}

.enter-button:disabled {
  opacity: .5;
}

.camera-overlay {
  position: absolute;
  inset: 0;
  background: #090807;
  opacity: 0;
  pointer-events: none;
  z-index: 8;
  transition: opacity 1.3s ease;
}

#entrance.entering .entrance-art {
  animation: enterCamera 2.5s ease-in forwards;
}

#entrance.entering .entrance-content {
  opacity: 0;
  transition: opacity .6s;
}

#entrance.entering .camera-overlay {
  opacity: 1;
  transition-delay: 1.5s;
}

@keyframes enterCamera {
  from { transform: scale(1.08); }
  to { transform: scale(1.7); }
}

/* CINEMATIC MUSEUM LOBBY */

#lobby {
  background: #100c09;
}

.lobby-art {
  position: absolute;
  inset: -3%;
  background-image: url("museum-lobby.png");
  background-size: cover;
  background-position: center;
  transform: scale(1.04);
  animation: lobbyReveal 3s ease-out forwards;
}

@keyframes lobbyReveal {
  from {
    transform: scale(1.13);
    filter: brightness(.45);
  }

  to {
    transform: scale(1.04);
    filter: brightness(1);
  }
}

.lobby-shade {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,.2),
      transparent 35%,
      rgba(0,0,0,.45)
    );
}

.lobby-caption {
  position: absolute;
  top: 7%;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  text-align: center;
  text-shadow: 0 3px 18px #000;
}

.lobby-caption h2 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(27px, 4vw, 44px);
  font-weight: 400;
  margin: 10px 0;
  letter-spacing: .045em;
}

.lobby-caption p {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(16px, 2vw, 21px);
  font-style: italic;
  color: #e0cdb5;
  margin: 0;
}

/* TICKET ON RECEPTION DESK */

.ticket-object {
  position: absolute;
  left: 50%;
  bottom: 12%;
  width: clamp(160px, 25vw, 300px);
  aspect-ratio: 1.75;
  transform: translateX(-50%) rotate(-5deg);
  background:
    url("museum-ticket.png") center / contain no-repeat,
    linear-gradient(135deg, #f0dfc1, #b99b70);
  border: 1px solid #b79565;
  box-shadow: 0 15px 35px #0008;
  cursor: pointer;
  transition: transform .4s ease, filter .4s ease;
  animation: ticketAppear 1.5s ease 1s both;
}

@keyframes ticketAppear {
  from {
    opacity: 0;
    transform: translate(-50%, 20px) rotate(-5deg);
  }

  to {
    opacity: 1;
    transform: translate(-50%, 0) rotate(-5deg);
  }
}

.ticket-object:hover {
  transform: translateX(-50%) rotate(-2deg) scale(1.06);
  filter: brightness(1.1);
}

.ticket-hint {
  position: absolute;
  bottom: 5%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: .18em;
  color: #f1d8b1;
  text-shadow: 0 2px 12px #000;
  white-space: nowrap;
}

/* TICKET CLOSE-UP */

.ticket-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(8, 6, 5, .83);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  opacity: 0;
  visibility: hidden;
  transition: opacity .5s, visibility .5s;
}

.ticket-overlay.open {
  opacity: 1;
  visibility: visible;
}

.ticket-closeup {
  position: relative;
  width: min(88vw, 470px);
  padding: 35px 30px;
  text-align: center;
  color: #3b2a1d;
  background:
    linear-gradient(145deg, #f4e6cc, #d7bd91);
  border: 2px solid #b58d57;
  outline: 5px solid #e6d2ad;
  box-shadow: 0 25px 90px #000b;
  transform: translateY(30px) scale(.9);
  transition: transform .6s ease;
}

.ticket-overlay.open .ticket-closeup {
  transform: translateY(0) scale(1);
}

.ticket-closeup::before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid #a98454;
  pointer-events: none;
}

.ticket-closeup h3 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(31px, 6vw, 46px);
  font-weight: 500;
  margin: 18px 0;
}

.ticket-closeup .ticket-details {
  font-size: 10px;
  line-height: 2.5;
  letter-spacing: .14em;
  color: #5b4630;
}

.ticket-closeup .ticket-line {
  height: 1px;
  margin: 22px 0;
  background: #b59467;
}

.ticket-closeup button {
  margin-top: 20px;
  padding: 13px 25px;
  background: #3c2b1f;
  border: 1px solid #967246;
  color: #f1e1c7;
  font-size: 10px;
  letter-spacing: .15em;
}

.ticket-close {
  position: absolute;
  top: 14px;
  right: 17px;
  background: none !important;
  border: none !important;
  color: #6b4e31 !important;
  font-size: 22px !important;
  padding: 0 !important;
}
  
/* SMALL SCREENS */

@media (max-width: 600px) {
  .entrance-art {
    background-position: center;
  }

  .entrance-content {
    bottom: 8vh;
  }
}

@media (prefers-reduced-motion: reduce) {
  .entrance-art {
    animation: none;
  }
}

.entrance-content {
  bottom: clamp(30px, 6vh, 65px);
}

.subtitle {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(17px, 2vw, 23px);
  font-weight: 400;
  letter-spacing: .035em;
  margin-bottom: 22px;
  text-shadow: 0 2px 15px #000;
}

.enter-button {
  font-size: 10px;
  font-weight: 300;
  letter-spacing: .2em;
  padding: 13px 30px;
  background: rgba(15, 11, 9, .55);
  border: 1px solid rgba(225, 192, 146, .65);
}
</style>
</head>

<body>

<section id="entrance" class="scene active">

  <div class="entrance-art"></div>
  <div class="entrance-shade"></div>

  <div class="entrance-content">

  <p class="subtitle">
    An exhibition of a love story still being made.
  </p>

  <button class="enter-button" id="enterButton" onclick="enterMuseum()">
    ENTER THE MUSEUM →
  </button>

</div>

  <div class="camera-overlay"></div>

</section>

<section id="lobby" class="scene">

  <div class="lobby-art"></div>
  <div class="lobby-shade"></div>

  <div class="lobby-caption">
    <div class="eyebrow">Welcome, Faris</div>

    <h2>A Collection of Us</h2>

    <p>Some things are too special to leave forgotten.</p>
  </div>

  <button
    class="ticket-object"
    onclick="openTicket()"
    aria-label="Examine your admission ticket">
  </button>

  <div class="ticket-hint">
    ✦ TAP THE TICKET ✦
  </div>

  <div class="ticket-overlay" id="ticketOverlay">

    <div class="ticket-closeup">

      <button
        class="ticket-close"
        onclick="closeTicket()"
        aria-label="Close ticket">
        ×
      </button>

      <div class="eyebrow" style="color:#8b693d">
        ADMISSION TICKET
      </div>

      <h3>The Museum of Us</h3>

      <div class="ticket-line"></div>

      <div class="ticket-details">
        VISITOR: FARIS<br>
        EXHIBITION: A COLLECTION OF US<br>
        DATE: 02.12.2026<br>
        ADMISSION: ONE VERY SPECIAL GUEST
      </div>

      <div class="ticket-line"></div>

      <button onclick="beginVisit()">
        BEGIN YOUR VISIT →
      </button>

    </div>

  </div>

</section>

<script>
function enterMuseum() {
  const entrance = document.getElementById("entrance");
  const button = document.getElementById("enterButton");

  if (entrance.classList.contains("entering")) return;

  button.disabled = true;
  entrance.classList.add("entering");

  setTimeout(() => {
    document.getElementById("lobby").classList.add("active");
    entrance.classList.remove("active");
  }, 2700);
}
  function openTicket() {
  document.getElementById("ticketOverlay").classList.add("open");
}

function closeTicket() {
  document.getElementById("ticketOverlay").classList.remove("open");
}

function beginVisit() {
  closeTicket();

  // Gallery scene will be connected next.
  alert("Gallery I — The Beginning");
}
</script>

</body>
</html>
