name: Recover GitHub Pages publishing
on:
  push:
    paths:
      - ".github/workflows/recover-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Switch Pages to branch publishing to bypass stuck workflow deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "Pages settings HTTP status: $HTTP_CODE"
          cat /tmp/pages-response.json
          echo
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then exit 1; fi
